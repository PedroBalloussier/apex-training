<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apex</title>
  <meta name="description" content="Apex: treino montado pela triagem, registro de séries, progresso, Hall da Fama e Party entre amigos.">
  <meta name="theme-color" content="#0B0F14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    // Aplica o tema salvo antes da primeira pintura (evita piscar)
    try {
      var s = JSON.parse(localStorage.getItem('apex:v1:settings') || '{}');
      var p = s.palette === 'sunset' ? 'sunset' : '';
      var m = s.mode === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', p ? (m === 'light' ? 'sunset-light' : 'sunset') : m);
      if (s.language === 'en') document.documentElement.lang = 'en';
    } catch (e) {}
  </script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="app" class="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
